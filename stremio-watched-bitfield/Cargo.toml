[package]
name = "stremio-watched-bitfield"
version = "0.1.0"
edition = "2021"
publish = false

# Aligned with the workspace MSRV. Originally pinned at 1.60 for `dep:serde`
# syntax; raising to 1.85 keeps all three crates on one Rust version.
rust-version = "1.85"

[lib]
doctest = false

[features]
default = ["serde"]

serde = ["dep:serde"]

[dependencies]
base64 = "0.13.0"
flate2 = "1.0.*"
# (de)serialization of WatchedBitField
serde = { version = "1", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"
serde = { version = "1", default-features = false }
